[package]
name = "media-streaming-metrics"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A small async Rust service for media delivery metrics"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

